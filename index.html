    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDGvlFAh8VE3rQJQ4xmkgumTJjoYw-hzHk", 
            authDomain: "stylezone24-cf067.firebaseapp.com", 
            databaseURL: "https://stylezone24-cf067-default-rtdb.firebaseio.com",
            projectId: "stylezone24-cf067", 
            storageBucket: "stylezone24-cf067.appspot.com", 
            messagingSenderId: "2467516999", 
            appId: "1:2467516999:web:a14328f6a66d49b6dd5762" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        function setContent(el, code) {
            if(!el || !code) return;
            if(code.startsWith('http')) { el.innerHTML = `<img src="${code}" style="width:100%;height:100%;object-fit:cover;">`; } 
            else {
                el.innerHTML = code;
                Array.from(el.querySelectorAll("script")).forEach(oldScript => {
                    const newScript = document.createElement("script");
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            }
        }
        
        // ✅ অফলাইন এরর হ্যান্ডেলিং যোগ করা হয়েছে (শেষে error callback)
        database.ref('parvezdatabase').on('value', s => { 
            const d = s.val(); 
            if(d) { 
                setContent(document.getElementById('slide1'), d.banner1_code); 
                setContent(document.getElementById('slide2'), d.banner2_code); 
                setContent(document.getElementById('slide3'), d.banner3_code); 
                setContent(document.getElementById('ad-spot-middle'), d.ad_spot_code);
            }
        }, error => console.log('⚠️ ব্যানার লোড হয়নি (অফলাইন?):', error.message));
        
        let paymentBannerUrl = "https://i.ibb.co/L9H8qD4/bkash-logo.png";
        let paymentNumber = "01760138572";
        
        database.ref('website_settings').on('value', snapshot => { 
            const settings = snapshot.val();
            if(settings) {
                document.title = settings.title || 'My website URL';
                document.getElementById('upload-header').textContent = settings.uploadHeader || 'Post your images here';
                document.getElementById('plans-header').textContent = settings.plansHeader || 'Our Subscription Plans';
                if(settings.paymentBannerUrl) {
                    paymentBannerUrl = settings.paymentBannerUrl;
                }
                paymentNumber = settings.paymentNumber || paymentNumber;
            }
        }, error => console.log('⚠️ সেটিংস লোড হয়নি (অফলাইন?):', error.message));

        document.addEventListener('DOMContentLoaded', () => {
            let currentIndex = 0;
            setInterval(() => { const wrapper = document.querySelector('.slider-wrapper'); if(wrapper) { wrapper.style.transform = `translateX(-${(currentIndex++ % 3) * 100 / 3}%)`; } }, 5000);
            
            const sidenav = document.getElementById('my-sidenav'), menuIcon = document.getElementById('menu-icon'), closeBtn = document.querySelector('.sidenav .close-btn');
            const tokenBalanceSpan = document.getElementById('token-balance'), customUploadButton = document.getElementById('custom-upload-button'), imageInput = document.getElementById('image-input');
            const uploadContainer = document.getElementById('upload-container'), progressContainer = document.getElementById('progress-container'), linksContainer = document.getElementById('links-container');
            const pricingSection = document.querySelector('.pricing-section');

            const encodeEmail = email => email.replace(/\./g, ',');

            function createInitialUserData(user) {
                const userRef = database.ref('users/' + encodeEmail(user.email));
                userRef.once('value', snapshot => {
                    if (!snapshot.exists()) {
                        userRef.set({ tokens: 10, usageHistory: 0, createdAt: Date.now() });
                    }
                });
            }

            auth.onAuthStateChanged(user => {
                if (user) {
                    createInitialUserData(user);
                    document.getElementById('sidenav-user-email').style.display = 'block';
                    document.getElementById('sidenav-user-email').textContent = user.email;
                    document.getElementById('register-link').style.display = 'none';
                    document.getElementById('login-link').style.display = 'none';
                    document.getElementById('logout-link').style.display = 'block';

                    database.ref('users/' + encodeEmail(user.email) + '/tokens').on('value', snap => { 
                        tokenBalanceSpan.textContent = snap.val() !== null ? snap.val() : 0; 
                    });
                } else {
                    document.getElementById('sidenav-user-email').style.display = 'none';
                    document.getElementById('register-link').style.display = 'block';
                    document.getElementById('login-link').style.display = 'block';
                    document.getElementById('logout-link').style.display = 'none';
                    tokenBalanceSpan.textContent = '0';
                }
            });

            menuIcon.onclick = () => sidenav.style.width = '250px';
            closeBtn.onclick = () => sidenav.style.width = '0';

            const regLogModal = document.getElementById('register-login-modal');
            const showAuthModal = (view) => {
                regLogModal.innerHTML = `
                    <div class="modal-content">
                        <span class="modal-close-button">&times;</span>
                        <div style="display:${view==='register'?'block':'none'}">
                            <h2>Create Account</h2>
                            <form id="register-form">
                                <div class="form-group"><input type="email" id="reg-email" placeholder="Enter Email" required></div>
                                <div class="form-group"><input type="password" id="reg-password" placeholder="Enter Password" required></div>
                                <button type="submit" class="modal-button">Register</button>
                            </form>
                            <button class="modal-button google-btn" id="google-signup-btn">Sign in with Google</button>
                            <p class="switch-form-link">Already have an account? <a href="#" id="show-login-view">Login</a></p>
                        </div>
                        <div style="display:${view==='login'?'block':'none'}">
                            <h2>Login</h2>
                            <form id="login-form">
                                <div class="form-group"><input type="email" id="login-email" placeholder="Enter Email" required></div>
                                <div class="form-group"><input type="password" id="login-password" placeholder="Enter Password" required></div>
                                <button type="submit" class="modal-button">Login</button>
                            </form>
                            <button class="modal-button google-btn" id="google-login-btn">Log in with Google</button>
                            <p class="switch-form-link">Don't have an account? <a href="#" id="show-register-view">Register</a></p>
                        </div>
                    </div>`;
                regLogModal.style.display = 'block';
                regLogModal.querySelector('.modal-close-button').onclick = () => regLogModal.style.display = 'none';
                regLogModal.querySelector('#show-login-view').onclick = (e) => { e.preventDefault(); showAuthModal('login'); };
                regLogModal.querySelector('#show-register-view').onclick = (e) => { e.preventDefault(); showAuthModal('register'); };
                
                document.getElementById('register-form').onsubmit = e => {
                    e.preventDefault();
                    const email = document.getElementById('reg-email').value;
                    const password = document.getElementById('reg-password').value;

                    auth.createUserWithEmailAndPassword(email, password)
                        .then((userCredential) => {
                            createInitialUserData(userCredential.user);
                            userCredential.user.sendEmailVerification();
                            alert('Registration successful! 10 free tokens added. Verification email sent.');
                            regLogModal.style.display = 'none';
                        })
                        .catch(error => alert(error.message));
                };

                document.getElementById('login-form').onsubmit = e => {
                    e.preventDefault();
                    const email = document.getElementById('login-email').value;
                    const password = document.getElementById('login-password').value;

                    auth.signInWithEmailAndPassword(email, password)
                        .then(() => {
                            regLogModal.style.display = 'none';
                            alert('Login successful!');
                        })
                        .catch(error => alert('Invalid credentials or user not found.'));
                };

                const handleGoogleSignIn = () => {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    auth.signInWithPopup(provider)
                        .then(result => {
                            createInitialUserData(result.user);
                            regLogModal.style.display = 'none';
                            alert('Google login successful!');
                        })
                        .catch(error => alert(error.message));
                };

                const gBtn1 = document.getElementById('google-signup-btn');
                const gBtn2 = document.getElementById('google-login-btn');
                if(gBtn1) gBtn1.onclick = handleGoogleSignIn;
                if(gBtn2) gBtn2.onclick = handleGoogleSignIn;

                sidenav.style.width = '0';
            };

            document.getElementById('register-link').onclick = e => { e.preventDefault(); showAuthModal('register'); };
            document.getElementById('login-link').onclick = e => { e.preventDefault(); showAuthModal('login'); };
            document.getElementById('logout-link').onclick = e => { e.preventDefault(); auth.signOut().then(() => alert('Logout successful!')); };
            
            document.getElementById('my-tokens-link').onclick = e => { 
                e.preventDefault(); 
                if(auth.currentUser){
                    alert(`Current balance: ${tokenBalanceSpan.textContent} Tokens`); 
                } else { alert('Please login first.'); }
            };

            document.getElementById('usage-history-link').onclick = e => { 
                e.preventDefault(); 
                const user = auth.currentUser;
                if(user){ 
                    database.ref('users/' + encodeEmail(user.email) + '/usageHistory').once('value', s => alert(`You have used ${s.val() || 0} tokens in total.`)); 
                } else { alert('Please login first.'); }
            };

            customUploadButton.addEventListener('click', () => {
                const user = auth.currentUser;
                if (!user) {
                    alert('Please login or register to upload images.');
                    showAuthModal('login');
                    return;
                }
                if (parseInt(tokenBalanceSpan.textContent) > 0) imageInput.click();
                else { alert('You have used all your tokens. Please buy a plan.'); pricingSection.scrollIntoView({ behavior: 'smooth' }); }
            });

            imageInput.addEventListener('change', e => { 
                if (e.target.files[0]) {
                    processAndUpload(e.target.files[0]);
                }
            });

            // Resizing function (Handles both Standard Max-width & Square App Icons)
            function processImageOption(file, optionValue) {
                return new Promise((resolve) => {
                    if (!optionValue) { resolve(file); return; }
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');

                            if (optionValue.startsWith('sq_')) {
                                const size = parseInt(optionValue.replace('sq_', ''));
                                canvas.width = size;
                                canvas.height = size;
                                ctx.drawImage(img, 0, 0, size, size);
                            } else {
                                const maxWidth = parseInt(optionValue);
                                if (img.width <= maxWidth) { resolve(file); return; }
                                const ratio = maxWidth / img.width;
                                canvas.width = maxWidth;
                                canvas.height = img.height * ratio;
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            }

                            canvas.toBlob((blob) => {
                                resolve(new File([blob], file.name, { type: 'image/png' }));
                            }, 'image/png', 0.95);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            async function processAndUpload(file) {
                const resizeOpt = document.getElementById('resize-options').value;
                const expirationOpt = document.getElementById('expiration-options').value;
                const user = auth.currentUser;
                
                uploadContainer.style.display = 'none';
                progressContainer.style.display = 'block';
                document.getElementById('file-name').textContent = `Processing: ${file.name}`;
                document.getElementById('progress-bar').style.width = '20%';

                try {
                    const processedFile = await processImageOption(file, resizeOpt);
                    document.getElementById('file-name').textContent = `Uploading: ${processedFile.name}`;
                    document.getElementById('progress-bar').style.width = '40%';

                    const userRef = database.ref('users/' + encodeEmail(user.email));
                    const tokenTransactionResult = await userRef.child('tokens').transaction((currentTokens) => {
                        if (currentTokens === null) return 0; 
                        if (currentTokens <= 0) return;
                        return currentTokens - 1;
                    });

                    if (!tokenTransactionResult.committed) {
                        throw new Error("Insufficient tokens or transaction failed.");
                    }

                    userRef.child('usageHistory').transaction(current => (current || 0) + 1);

                    const formData = new FormData();
                    formData.append('image', processedFile);
                    let url = `https://api.imgbb.com/1/upload?key=07bb6a485d95048a7add76d3207d44be`;
                    
                    document.getElementById('progress-bar').style.width = '60%';
                    const response = await fetch(url, { method: 'POST', body: formData });
                    const result = await response.json();
                    
                    if(result.success) {
                        document.getElementById('progress-bar').style.width = '100%';
                        
                        if(expirationOpt) {
                            const expDays = parseInt(expirationOpt);
                            const expiryDate = Date.now() + (expDays * 24 * 60 * 60 * 1000);
                            database.ref('image_metadata/' + result.data.id).set({
                                deleteUrl: result.data.delete_url,
                                expiryTimestamp: expiryDate,
                                user: user.email
                            });
                        }

                        displayLinks(result.data);
                    } else { throw new Error(result.error.message); }
                } catch (error) {
                    alert(`Error: ${error.message}`);
                    resetUploader();
                }
            }

            window.displayLinks = (data) => {
                linksContainer.style.display = 'block';
                progressContainer.style.display = 'none';

                const viewerUrl = data.url_viewer;
                const imageUrl = data.url;
                const thumbUrl = data.thumb.url;
                const deleteUrl = data.delete_url;

                linksContainer.innerHTML = `
                    <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Upload Successful!</h2>
                    <div style="text-align: center; margin-bottom: 25px;">
                        <a href="${viewerUrl}" target="_blank">
                            <img src="${imageUrl}" style="max-width: 100%; max-height: 280px; border: 1px solid #ddd; border-radius: 8px; padding: 4px;">
                        </a>
                    </div>
                    <div class="link-item">
                        <label style="font-weight: bold; margin-bottom: 5px; display: block;">Viewer Link:</label>
                        <div class="link-box"><input id="viewer-link" value="${viewerUrl}" readonly><button onclick="copyToClipboard('viewer-link')">Copy</button></div>
                    </div>
                    <div class="link-item">
                        <label style="font-weight: bold; margin-bottom: 5px; display: block;">Direct Link:</label>
                        <div class="link-box"><input id="direct-link" value="${imageUrl}" readonly><button onclick="copyToClipboard('direct-link')">Copy</button></div>
                    </div>
                    <div class="link-item">
                        <label style="font-weight: bold; margin-bottom: 5px; display: block;">Markdown:</label>
                        <div class="link-box"><input id="markdown-link" value="![${data.title}](${imageUrl})" readonly><button onclick="copyToClipboard('markdown-link')">Copy</button></div>
                    </div>
                    <div class="link-item">
                        <label style="font-weight: bold; margin-bottom: 5px; display: block;">Thumbnail for Forums:</label>
                        <div class="link-box"><input id="thumb-forum-link" value="[url=${viewerUrl}][img]${thumbUrl}[/img][/url]" readonly><button onclick="copyToClipboard('thumb-forum-link')">Copy</button></div>
                    </div>
                    <div class="link-item">
                        <label style="font-weight: bold; margin-bottom: 5px; display: block;">Thumbnail for Website:</label>
                        <div class="link-box"><input id="thumb-html-link" value='<a href="${viewerUrl}" target="_blank"><img src="${thumbUrl}" alt="${data.title}"></a>' readonly><button onclick="copyToClipboard('thumb-html-link')">Copy</button></div>
                    </div>
                    <div class="link-item">
                        <label style="font-weight: bold; margin-bottom: 5px; display: block;">Delete Link:</label>
                        <div class="link-box"><input id="delete-link" value="${deleteUrl}" readonly><button onclick="copyToClipboard('delete-link')">Copy</button></div>
                    </div>
                    <button class="choose-images-button" onclick="resetUploader()" style="margin-top: 25px;">Upload Another Image</button>
                `;
            };
            
            window.resetUploader = () => {
                linksContainer.innerHTML = '';
                linksContainer.style.display = 'none';
                progressContainer.style.display = 'none';
                document.getElementById('progress-bar').style.width = '0%';
                uploadContainer.style.display = 'block';
                imageInput.value = '';
            };

            window.copyToClipboard = (id) => {
                const input = document.getElementById(id);
                input.select(); 
                input.setSelectionRange(0, 99999); 
                navigator.clipboard.writeText(input.value).then(() => {
                    alert('Copied!');
                }).catch(() => {
                    document.execCommand('copy'); 
                    alert('Copied!');
                });
            };

            const paymentModal = document.getElementById('payment-modal-overlay');
            document.querySelectorAll('.plan-card:not(.free-token-notice)').forEach(card => {
                card.addEventListener('click', () => {
                    const user = auth.currentUser;
                    if(!user) {
                        alert('Please login or register to buy a plan.');
                        showAuthModal('login');
                    } else {
                        const price = card.dataset.price;
                        paymentModal.innerHTML = `
                            <div class="modal-content">
                                <span class="modal-close-button">&times;</span>
                                <div class="bkash-header">
                                    <img id="payment-banner-img" src="${paymentBannerUrl}" alt="bKash Payment" onerror="this.onerror=null; this.src='https://i.ibb.co/L9H8qD4/bkash-logo.png';">
                                </div>
                                <div class="bkash-body">
                                    <div class="bkash-amount">৳ ${price}</div>
                                    <div class="bkash-pink-box">
                                        <h3>পেমেন্ট করার নিয়মাবলী</h3>
                                        <form id="verify-payment-form">
                                            <ul class="bkash-instructions">
                                                <li>১. আপনার বিকাশ অ্যাপ অথবা *247# ডায়াল করুন।</li>
                                                <li>২. নিচে দেওয়া নাম্বারে <b>Send Money</b> করুন:</li>
                                                <li class="bkash-number-copy">
                                                    <span>${paymentNumber}</span>
                                                    <button type="button" id="copy-bkash-btn">কপি</button>
                                                </li>
                                                <li>৩. টাকার পরিমাণ দিন: <b>৳ ${price}</b></li>
                                                <li>৪. পেমেন্ট সফল হলে প্রাপ্ত <b>TrxID</b>-টি নিচের ঘরে বসিয়ে ভেরিফাই করুন:</li>
                                            </ul>
                                            <input type="text" id="trx-id" placeholder="ট্রানজেকশন আইডি (TrxID) দিন" required>
                                            <button type="submit" class="verify-button">VERIFY</button>
                                        </form>
                                    </div>
                                </div>
                            </div>`;
                        paymentModal.style.display = 'block';
                        const modalContentElement = paymentModal.querySelector('.modal-content');
                        if (modalContentElement) modalContentElement.scrollTop = 0;

                        paymentModal.querySelector('.modal-close-button').onclick = () => paymentModal.style.display = 'none';
                        paymentModal.querySelector('#copy-bkash-btn').onclick = () => { navigator.clipboard.writeText(paymentNumber); alert('নাম্বার কপি করা হয়েছে!'); };
                        document.getElementById('verify-payment-form').onsubmit = e => {
                            e.preventDefault();
                            const trxId = document.getElementById('trx-id').value;
                            if(trxId) {
                                database.ref('pending_payments').push({ userEmail: user.email, plan: card.dataset.plan, price: price, trxId: trxId, timestamp: Date.now() });
                                alert('ধন্যবাদ! আপনার পেমেন্ট ভেরিফিকেশন রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে। এডমিন চেক করে দ্রুত টোকেন যুক্ত করে দেবে।');
                                paymentModal.style.display = 'none';
                            }
                        };
                    }
                });
            });
        });
    </script>

    <!-- ✅ PWA: Service Worker রেজিস্টার + অনলাইন/অফলাইন ডিটেক্ট (নতুন যোগ) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ Service Worker রেজিস্টার হয়েছে:', reg.scope))
                    .catch(err => console.log('❌ Service Worker রেজিস্টার হয়নি:', err));
            });
        }

        const offlineBanner = document.getElementById('offline-banner');
        function updateOnlineStatus() {
            offlineBanner.style.display = navigator.onLine ? 'none' : 'block';
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();
    </script>
</body>
</html>
